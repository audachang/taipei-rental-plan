<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>台北居住區域比較</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23c65f28'/%3E%3Cpath d='M3 8h10v5H3zM5 5h6v3H5z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">光仁小學通學規劃 · 2026/08</p>
        <h1>台北居住區域比較與推薦</h1>
        <nav class="page-nav" aria-label="頁面導覽">
          <a aria-current="page" href="index.html">區域比較</a>
          <a href="rental-search.html">房源廣搜推薦</a>
          <a href="new-build-rentals.html">新建案出租地圖</a>
        </nav>
      </div>
      <div class="header-meta" aria-label="固定規劃條件">
        <span>目的地：臺北市萬華區萬大路423巷15號</span>
        <span>家庭：三人</span>
      </div>
    </header>

    <main class="layout">
      <aside class="controls" aria-label="區域比較設定">
        <section class="panel">
          <div class="section-heading">
            <h2>新增區域</h2>
          </div>
          <form id="addRegionForm" class="region-form">
            <label class="field">
              <span>輸入行政區、捷運站或生活圈</span>
              <input id="regionInput" list="regionSuggestions" type="text" placeholder="例如：信義區、士林、南京復興">
            </label>
            <datalist id="regionSuggestions"></datalist>
            <button class="primary-button" type="submit">新增比較</button>
            <p id="addRegionStatus" class="form-status" role="status" aria-live="polite"></p>
          </form>
        </section>

        <section class="panel">
          <div class="section-heading">
            <h2>目前比較</h2>
            <button class="text-button" id="resetRegions" type="button">重設</button>
          </div>
          <div id="selectedRegions" class="selected-regions" aria-live="polite"></div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <h2>推薦偏好</h2>
          </div>

          <label class="field">
            <span>主要判準</span>
            <select id="priority">
              <option value="balanced" selected>均衡推薦</option>
              <option value="commute">通學穩定優先</option>
              <option value="rent">租金壓力優先</option>
              <option value="livability">生活品質優先</option>
              <option value="zhongli">中壢往返優先</option>
            </select>
          </label>

          <label class="field">
            <span>月租上限</span>
            <select id="rentLimit">
              <option value="70000">NT$70k</option>
              <option value="60000" selected>NT$60k</option>
              <option value="50000">NT$50k</option>
              <option value="45000">NT$45k</option>
              <option value="40000">NT$40k</option>
            </select>
          </label>

          <label class="field">
            <span>到校時間上限</span>
            <select id="commuteLimit">
              <option value="55">55 分</option>
              <option value="45" selected>45 分</option>
              <option value="40">40 分</option>
              <option value="30">30 分</option>
              <option value="20">20 分</option>
            </select>
          </label>
        </section>

        <section class="panel">
          <h2>排序</h2>
          <div class="segmented" role="group" aria-label="排序方式">
            <button class="segment active" data-sort="score" type="button">推薦</button>
            <button class="segment" data-sort="commute" type="button">通學</button>
            <button class="segment" data-sort="rent" type="button">租金</button>
          </div>
        </section>
      </aside>

      <section class="workspace" aria-label="區域特性比較">
        <div class="toolbar">
          <div>
            <h2>區域特性比較</h2>
            <p id="resultCount">載入中</p>
          </div>
          <button id="copySummary" class="primary-button" type="button">複製推薦摘要</button>
        </div>

        <section class="recommendation-panel" aria-label="目前推薦">
          <div>
            <span class="metric-label">目前推薦</span>
            <strong id="bestName">-</strong>
          </div>
          <div>
            <span class="metric-label">推薦理由</span>
            <p id="bestReason">-</p>
          </div>
          <div>
            <span class="metric-label">需要驗證</span>
            <p id="bestCaution">-</p>
          </div>
        </section>

        <div id="cards" class="cards" aria-live="polite"></div>

        <section class="compare-section">
          <div class="section-heading">
            <h2>並排比較</h2>
            <span class="hint">只顯示目前加入比較且符合篩選條件的區域</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead id="compareHead"></thead>
              <tbody id="compareBody"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <template id="cardTemplate">
      <article class="option-card">
        <div class="card-top">
          <div>
            <h3></h3>
            <p class="option-meta"></p>
          </div>
          <span class="score-badge"></span>
        </div>
        <dl class="metrics"></dl>
        <div class="recommendation-text"></div>
        <div class="tag-list"></div>
        <details>
          <summary>風險與現場驗證</summary>
          <div class="detail-grid"></div>
        </details>
      </article>
    </template>

    <script src="data/evidence.js?v=20260626-region"></script>
    <script src="data/options.js?v=20260626-region"></script>
    <script src="app.js?v=20260626-region"></script>
  </body>
</html>
